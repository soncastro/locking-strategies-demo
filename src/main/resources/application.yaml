spring:
  application:
    name: Locking Strategies Demo
  datasource:
    url: jdbc:postgresql://localhost:5432/locking-strategies-demo-db
    username: locking-strategies-demo-user
    password: locking-strategies-demo-password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    dev.soncastro.lockingstrategiesdemo.controller: DEBUG
    dev.soncastro.lockingstrategiesdemo.usecase: DEBUG
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%logger{36}){cyan} %clr(-){faint} %msg%n"
